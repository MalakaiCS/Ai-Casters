[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-esports-caster"
version = "0.1.0"
description = "Autonomous AI commentary for Counter-Strike 2 broadcasts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AI Esports Caster" }]

# Runtime dependencies. Heavy ML/vision/voice/OBS deps are intentionally NOT
# required for Milestone 1 so the foundation stays lean and CI-friendly; they
# are added per-milestone as the corresponding modules land.
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Desktop UI. Kept optional so headless CI can run the domain test suite
# without a display server / Qt binaries.
ui = ["PySide6>=6.6"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # Starlette TestClient dependency
    "ruff>=0.4",
]

[project.scripts]
ai-caster = "ai_caster.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_caster = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI dependency-injection idiom uses calls in defaults
